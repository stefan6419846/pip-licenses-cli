name: CI

on:
- push
- pull_request
- workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test with Python ${{ matrix.python }}
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: setup test environment
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: install pip
        run:
          python -m pip install --upgrade pip wheel
      - name: Lint with black
        uses: psf/black@258e7dbf348bc23cb70b8cdf693481c04634ebcc  # 26.10.1
        with:
          options: "--check --diff"
      - name: Install dependencies
        run:
          python -m pip install -r requirements/dev.txt
      - name: Lint with flake8
        run:
          python -m flake8 .
      - name: Validate static typing with mypy
        run:
          mypy .
      - name: Test (SPDX support)
        run:
          python -m coverage run --data-file=.coverage.spdx -m unittest discover --verbose --start-directory tests
      - name: Test (Default)
        run: |
          python -m pip uninstall license-expression -y
          python -m coverage run --data-file=.coverage.no_spdx -m unittest discover --verbose --start-directory tests
      - name: Report coverage
        run: |
          python -m coverage combine
          python -m coverage report --fail-under=100
        if: ${{ matrix.python != '3.9' }}
